  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background: #060512;
      background: radial-gradient(circle at center, #130e2e 0%, #060512 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      color: #ffffff;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 380px;
      background: rgba(18, 17, 38, 0.7);
      border: 1px solid rgba(110, 100, 200, 0.18);
      border-radius: 24px;
      padding: 32px 20px 28px 20px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .badge {
      font-size: 11px;
      letter-spacing: 3px;
      color: #00d2ff;
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 6px;
      text-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
    }

    .logo-wrapper {
      position: relative;
      width: 120px;
      height: 120px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-wrapper::before {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #00d2ff, #7928ca, #00d2ff);
      filter: blur(10px);
      opacity: 0.8;
      animation: rotate 6s linear infinite;
    }

    @keyframes rotate {
      100% { transform: rotate(360deg); }
    }

    .logo-img {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #00d2ff;
      background-color: #0d0b21;
    }

    .title {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 2px;
      margin-bottom: 8px;
      background: linear-gradient(180deg, #ffffff 0%, #c1bbf3 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .divider {
      width: 40px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #7928ca, #00d2ff, transparent);
      margin: 0 auto 16px auto;
    }

    .subtitle {
      font-size: 13px;
      color: #a09cb0;
      line-height: 1.5;
      margin-bottom: 28px;
      font-weight: 400;
    }

    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(90deg, #6b11ff 0%, #00d2ff 100%);
      color: #ffffff;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 8px 25px rgba(107, 17, 255, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
      outline: none;
      position: relative;
      overflow: hidden;
    }

    .btn:active {
      transform: scale(0.98);
      box-shadow: 0 4px 15px rgba(107, 17, 255, 0.3);
    }

    .footer-note {
      font-size: 11px;
      color: #6a667f;
      margin-top: 14px;
      font-weight: 400;
    }

    /* Honeypot link for bots */
    .bot-trap {
      position: absolute;
      left: -9999px;
      top: -9999px;
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- Hidden Honeypot for automated bots -->
  <a href="https://example.com" class="bot-trap" tabindex="-1" aria-hidden="true" id="honeypot">Do Not Click</a>

  <div class="container">
    <div class="badge">◆ ARISE ◆</div>
    
    <div class="logo-wrapper">
      <img src="https://d1yei2z3i6k35z.cloudfront.net/18362304/6a548615d60a88.04448021_5941.jpg" alt="VEER GAME" class="logo-img">
    </div>

    <h1 class="title">QUEEN ARMY</h1>
    <div class="divider"></div>

    <p class="subtitle">Daily market levels and setups. Free to join.</p>

    <button class="btn" id="joinBtn">
      JOIN TELEGRAM
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"></line>
        <polyline points="12 5 19 12 12 19"></polyline>
      </svg>
    </button>

    <p class="footer-note">Tap to open Telegram and send your request.</p>
  </div>

  <script>
    const TELEGRAM_URL = "https://t.me/+MTNFYFpZQK8xMmJl";
    let isHumanInteraction = false;
    let lastClickTime = 0;

    // Detect genuine human interaction (Touch / Mouse move)
    function trackHuman() {
      isHumanInteraction = true;
    }
    window.addEventListener('touchstart', trackHuman, { once: true });
    window.addEventListener('mousemove', trackHuman, { once: true });

    // Anti-Bot Checks
    function isBot() {
      // 1. Check headless browser / automation tools (Selenium, Puppeteer)
      if (navigator.webdriver) return true;
      if (window.document.documentElement.getAttribute("webdriver")) return true;
      
      // 2. Check automated user agents
      const botRegex = /bot|googlebot|crawler|spider|robot|crawling|headlesschrome|puppeteer|selenium/i;
      if (botRegex.test(navigator.userAgent)) return true;

      // 3. Block click if no mouse/touch movement occurred prior
      if (!isHumanInteraction) return true;

      return false;
    }

    document.getElementById('joinBtn').addEventListener('click', function(e) {
      e.preventDefault();

      // Prevent Spam / Fake Double Clicking (Within 2 Seconds)
      const now = Date.now();
      if (now - lastClickTime < 2000) {
        return;
      }
      lastClickTime = now;

      // If Bot Detected, cancel click quietly
      if (isBot()) {
        console.warn("Automated click blocked.");
        return;
      }

      // Fire Meta Pixel Events
      if (typeof fbq === 'function') {
        fbq('track', 'Lead');
        fbq('track', 'Subscribe');
        fbq('trackCustom', 'JoinTelegramClick');
      }

      // Redirect to Telegram Channel
      setTimeout(function() {
        window.location.href = TELEGRAM_URL;
      }, 250);
    });

    // Disable Right Click & F12 to prevent code stealing / automated inspect bots
    document.addEventListener('contextmenu', event => event.preventDefault());
    document.onkeydown = function(e) {
      if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74)) || (e.ctrlKey && e.keyCode == 85)) {
        return false;
      }
    };
  </script>
</body>
</html>
